apiVersion: supabase.guion.dev/v1alpha1
kind: SupabaseProject
metadata:
  labels:
    app.kubernetes.io/name: cloudnative-supabase
    app.kubernetes.io/managed-by: kustomize
  name: example
  namespace: example
spec:
  database:
    instances: 1
    storage:
      size: 10Gi
      storageClass: local-path
    enableSuperuserAccess: false
    # Additional roles for CDC tools like Sequin/PowerSync
    # Uses CNPG RoleConfiguration format directly
    # additionalRoles:
    #   - name: sequin_replication
    #     login: true
    #     replication: true
    #     bypassRLS: true
    #     passwordSecret:
    #       name: sequin-replication-password

  auth:
    siteURL: https://app.example.com
    externalURL: https://auth.example.com
    autoConfirmEmail: true
    providers:
      google:
        enabled: true
        skipNonceCheck: true
      apple:
        enabled: true
      secretRef: auth-providers

  rest:
    schemas:
      - public

  studio:
    publicURL: https://studio.example.com
    organizationName: Example Org
    projectName: Example Project

  # meta and kong use defaults (always enabled)
