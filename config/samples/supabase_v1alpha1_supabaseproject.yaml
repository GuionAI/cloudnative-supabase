apiVersion: supabase.guion.dev/v1alpha1
kind: SupabaseProject
metadata:
  labels:
    app.kubernetes.io/name: cloudnative-supabase
    app.kubernetes.io/managed-by: kustomize
  name: example
  namespace: example
spec:
  database:
    instances: 1
    storage:
      size: 10Gi
      storageClass: local-path
    enableSuperuserAccess: false

  auth:
    siteURL: https://app.example.com
    externalURL: https://auth.example.com
    autoConfirmEmail: true
    providers:
      google:
        enabled: true
        skipNonceCheck: true
      apple:
        enabled: true
      secretRef: auth-providers

  rest:
    schemas:
      - public

  studio:
    publicURL: https://studio.example.com
    organizationName: Example Org
    projectName: Example Project

  # meta and kong use defaults (always enabled)

  # --- Optional CDC/Search Services ---
  # Uncomment sections below to enable. Presence = enabled, absence = disabled.
  # All secrets, roles, and permissions are auto-generated.

  # Sequin CDC/event streaming (bundled Redis auto-deployed)
  # sequin: {}

  # Sequin with external Redis
  # sequin:
  #   replicas: 1
  #   redis:
  #     external:
  #       host: redis.infra.svc
  #       port: 6379

  # Powersync offline-first sync
  # powersync:
  #   api:
  #     replicas: 2
  #   syncRules:
  #     inline: |
  #       bucket_definitions:
  #         global:
  #           data:
  #             - SELECT * FROM public.*

  # Meilisearch full-text search
  # meilisearch:
  #   persistence:
  #     size: 10Gi
