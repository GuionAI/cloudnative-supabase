apiVersion: supabase.guion.dev/v1alpha1
kind: SupabaseProject
metadata:
  labels:
    app.kubernetes.io/name: cloudnative-supabase
    app.kubernetes.io/managed-by: kustomize
  name: example
  namespace: example
spec:
  # Orphaned Secret synchronized by the external credential manager.
  projectCredentialsSecret: example-project-credentials
  database:
    instances: 1
    storage:
      size: 10Gi
      storageClass: local-path
    enableSuperuserAccess: false

  auth:
    siteURL: https://app.example.com
    externalURL: https://auth.example.com
    autoConfirmEmail: true
    enableAnonymousUsers: false
    providers:
      google:
        enabled: true
        skipNonceCheck: true
      apple:
        enabled: true
      secretRef: auth-providers

  rest:
    schemas:
      - public

  studio:
    publicURL: https://studio.example.com
    organizationName: Example Org
    projectName: Example Project

  # Meta and Envoy use defaults (all core services are always enabled).

  # Optional PowerSync offline-first sync. The managed default is
  # journeyapps/powersync-service:1.21.0 with native metrics on named port
  # 9464 and an operator-generated same-namespace <project>-powersync-api-token
  # Secret (key: token) for authenticated Diagnostics. Sync Streams are required
  # and should select explicit columns guarded by auth.user_id(). An explicit
  # image override applies to API, replication, and compaction.
  # powersync:
  #   api:
  #     replicas: 1
  #   syncRules:
  #     inline: |
  #       config:
  #         edition: 3
  #       streams:
  #         notes:
  #           auto_subscribe: true
  #           query: SELECT id, title FROM notes WHERE user_id = auth.user_id()
