# Example: adopting a preserved database with simultaneous recovery and
# steady-state backup. The credential and S3 Secrets are managed separately.
apiVersion: supabase.guion.dev/v1alpha1
kind: SupabaseProject
metadata:
  name: flicknote
  namespace: flicknote
spec:
  projectCredentialsSecret: flicknote-project-credentials
  database:
    instances: 1
    storage:
      size: 20Gi
      storageClass: local-path
    recovery:
      enabled: true
      serverName: flicknote-source
      destinationPath: s3://flicknote-recovery/source
      s3CredentialsSecret: flicknote-recovery-s3
    backup:
      enabled: true
      destinationPath: s3://flicknote-backups/current
      s3CredentialsSecret: flicknote-backup-s3
      schedule: "0 0 2 * * *"
      retentionPolicy: 30d
  auth:
    siteURL: https://app.flicknote.app
    externalURL: https://auth.flicknote.app
    accessTokenExpirationSeconds: 3600
    autoConfirmEmail: true
    providers:
      google:
        enabled: true
        skipNonceCheck: true
      apple:
        enabled: true
      secretRef: supabase-auth-providers
    emailHook:
      enabled: true
      uri: https://email.flicknote.app/api/v1/gotrue
  rest:
    schemas:
      - public
  studio:
    publicURL: https://studio.flicknote.app
    organizationName: FlickNote
    projectName: FlickNote
  gateway:
    replicas: 1
