# This rule is not used by the project cloudnative-supabase itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the supabase.guion.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cloudnative-supabase
    app.kubernetes.io/managed-by: kustomize
  name: supabaseproject-editor-role
rules:
- apiGroups:
  - supabase.guion.dev
  resources:
  - supabaseprojects
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - supabase.guion.dev
  resources:
  - supabaseprojects/status
  verbs:
  - get
