name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: guionai/cloudnative-supabase
  POSTGRES_IMAGE_NAME: guionai/cloudnative-supabase-postgres-pgroonga
  CHART_REGISTRY: oci://ghcr.io/guionai/charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Tanka
        run: go install github.com/grafana/tanka/cmd/tk@v0.37.4

      - name: Run tests
        run: make test test-tanka test-delivery

      - name: Generate and check manifests
        run: |
          make generate manifests
          cp config/crd/bases/*.yaml charts/cloudnative-supabase/crds/
          git diff --exit-code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package and push Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          mkdir -p dist
          helm package charts/cloudnative-supabase --version "${VERSION}" --app-version "${VERSION}" --destination dist
          helm push "dist/cloudnative-supabase-${VERSION}.tgz" "${CHART_REGISTRY}"
          helm pull "${CHART_REGISTRY}/cloudnative-supabase" --version "${VERSION}" --destination /tmp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            config/crd/bases/*.yaml
            dist/*.tgz

  postgres-pgroonga:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke without publishing
        run: |
          docker build --platform linux/amd64 -f Dockerfile.postgres-pgroonga -t cnsupa-postgres-pgroonga:chatgpt-mcp-pg .
          CONTAINER_TOOL=docker hack/test-pgroonga-image.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: postgres-meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.POSTGRES_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.postgres-pgroonga
          push: true
          platforms: linux/amd64
          tags: ${{ steps.postgres-meta.outputs.tags }}
          labels: ${{ steps.postgres-meta.outputs.labels }}
          cache-from: type=gha,scope=postgres-pgroonga
          cache-to: type=gha,scope=postgres-pgroonga,mode=max
